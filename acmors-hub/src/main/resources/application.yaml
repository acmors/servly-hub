server:
  port: 8080
spring:
  application:
    name: acmors-hub

  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

asaas:
  webhook:
    token: ${ASAAS_WEBHOOK_TOKEN}
  base-url: https://api-sandbox.asaas.com/v3
  api-key: ${API_KEY}